<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chimera">
<meta name="theme-color" content="#5A1A10">
<title>Chimera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --table:#9E2F1E; --deep:#6B1C11; --deeper:#4E140C; --prgb:78,20,12; --back:#6B1C11; --backl:#D4AF37;
  --paper:#F4ECD9; --ink:#1E1A16; --gold:#E2B85A; --gold2:#B98E35;
  --hunt:#5CC8B4; --fresh:#B98AF5; --turn:#FF2DAA; --bomb:#FF7A1A;
  --jade:#1F7A55; --sword:#2A2622; --pag:#1E5DA6; --star:#C23A27;
  --serif:'Shippori Mincho','Hiragino Mincho ProN','Songti SC',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0}
body{
  background-color:var(--table);
  background-image:
    radial-gradient(circle at 50% 100%,transparent 42%,rgba(0,0,0,.07) 43%,rgba(0,0,0,.07) 49%,transparent 50%),
    radial-gradient(circle at 50% 100%,transparent 42%,rgba(0,0,0,.07) 43%,rgba(0,0,0,.07) 49%,transparent 50%);
  background-size:40px 20px;background-position:0 0,20px 10px;
  color:var(--paper);font:15px/1.4 var(--sans);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
.btn{font:600 16px var(--sans);padding:12px 16px;border-radius:12px;border:none;background:var(--paper);color:var(--ink);min-height:46px;cursor:pointer}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid rgba(244,236,217,.45)}
.btn:disabled{opacity:.35}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{font:16px var(--sans);padding:12px;border-radius:10px;border:1px solid rgba(0,0,0,.2);background:var(--paper);color:var(--ink);width:100%}

.screen{flex:1;overflow:auto;padding:28px 22px;display:flex;flex-direction:column;gap:14px;max-width:460px;width:100%;margin:0 auto}
.brand{font:800 54px/1 var(--serif);letter-spacing:.04em;margin:10px 0 0;color:var(--paper);text-shadow:0 2px 0 var(--deeper)}
.brand small{display:block;font:600 15px var(--sans);letter-spacing:0;opacity:.75;margin-top:10px;text-shadow:none}
.panel{background:rgba(var(--prgb),.55);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font:600 15px var(--sans);opacity:.85}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.bigcode{font:800 48px/1 var(--serif);letter-spacing:.2em;color:var(--gold);text-align:center;padding:6px 0}
.seats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.seats li{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(244,236,217,.08)}
.seats li.empty{opacity:.5;font-style:italic}
.err{color:#FFD2C4;font-size:14px}
.note{font-size:13px;opacity:.8;margin:0}

/* ---------- Game ---------- */
.top,.opps,.me{flex-shrink:0}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(var(--prgb),.6)}
.code{background:none;border:1px solid rgba(244,236,217,.35);border-radius:9px;padding:6px 9px;font:800 14px var(--serif);letter-spacing:.1em;color:var(--gold);white-space:nowrap}
.scores{flex:1;min-width:0;display:flex;gap:6px}
.sc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:3px 4px;border-radius:8px;border-bottom:3px solid transparent}
.sc span{font-size:11px;opacity:.85;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{font:800 17px/1.1 var(--serif)}
.em{font-size:14px;line-height:1;vertical-align:-1px;margin-right:1px}
.stbox{margin-left:auto;font:700 12px var(--sans);white-space:nowrap;opacity:.9}
.stbox.mine{margin-left:6px;font-size:12px}
.stbox+.ib{margin-left:6px}
.sc.me{background:rgba(244,236,217,.12)}
.sc.r-h{border-bottom-color:var(--hunt)} .sc.r-c{border-bottom-color:var(--gold)}
.sc.turn{background:var(--turn);color:#fff;box-shadow:0 0 16px rgba(255,45,170,.85);animation:pulse 1.2s ease-in-out infinite}
.lim{font-size:11px;opacity:.6}

.opps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;padding:6px 8px 0}
.opp{position:relative;min-width:0;overflow:hidden;background:rgba(var(--prgb),.5);border-radius:12px;padding:5px 8px;border:3px solid rgba(244,236,217,.12)}
.opp.r-h{border-color:var(--hunt);background:rgba(20,70,62,.35)}
.opp.r-c{border-color:var(--gold);background:rgba(90,60,10,.3)}
.opp.turn{box-shadow:0 0 0 3px var(--turn),0 0 26px rgba(255,45,170,.75)}
.opp.off{opacity:.55}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:7em;display:inline-block;vertical-align:bottom}
.role{display:inline-block;font:700 10px var(--sans);padding:2px 6px;border-radius:20px;margin-left:5px;vertical-align:middle;color:var(--ink)}
.role.c{background:var(--gold)}
.role.h{background:var(--hunt)}
.cnt{display:flex;align-items:center;gap:5px;margin-top:2px;min-height:30px;min-width:0}
.cnt b{font:800 19px/1 var(--serif)}
.mini{width:16px;height:22px;border-radius:3px;background-color:var(--back);border:1.5px solid var(--backl);
  background-image:repeating-linear-gradient(45deg,transparent 0 3px,color-mix(in srgb,var(--backl) 45%,transparent) 3px 4px)}
.sub{font-size:12px;opacity:.75}
.bubble{position:absolute;right:6px;top:5px;background:var(--paper);color:var(--ink);font:800 13px var(--serif);padding:3px 9px;border-radius:12px}
.bubble.pass{background:rgba(244,236,217,.25);color:var(--paper);font-family:var(--sans);font-weight:600}
.bubble.now{background:var(--turn);color:#fff;font-family:var(--sans);font-weight:800;animation:pulse 1.2s ease-in-out infinite}
.zz{font-size:15px;margin-left:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7CD992;margin-right:5px;vertical-align:middle}
.off .dot{background:#888}

.center{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cin{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.trick{display:flex;flex-direction:column;align-items:center;gap:6px}
.trick .who{font-size:13px;opacity:.85}
.combo{font:700 17px var(--serif);color:var(--gold)}
.cardrow{display:flex;flex-wrap:wrap;justify-content:center;padding-left:14px;row-gap:6px;--cw:42px;--ch:62px}
.cardrow .card{margin-left:-14px}
.cardrow.loose{padding-left:0;gap:6px}.cardrow.loose .card{margin-left:0}
.lead{font:700 20px var(--serif);margin:0}
.log{font-size:13px;opacity:.75;display:flex;flex-direction:column;gap:2px}
.tally{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tag{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(244,236,217,.14)}
.tag.bid{background:rgba(226,184,90,.25);color:var(--gold);font-weight:700}
.tag.pts{background:var(--paper);color:var(--ink);font-weight:700}
.bigmsg{font:800 22px/1.25 var(--serif);margin:0}
.fu{display:flex;align-items:center;gap:10px;justify-content:center;--cw:42px;--ch:62px}
.gameover{background:var(--gold);color:var(--ink);border-radius:18px;padding:14px 22px;box-shadow:0 6px 24px rgba(0,0,0,.35);margin-bottom:6px}
.go1{font:800 34px/1.1 var(--serif);letter-spacing:.02em}
.go2{font:700 20px/1.3 var(--sans);margin-top:4px}
.ptsbox{margin-left:auto;align-self:flex-end;margin-right:4px;font:700 12px var(--sans);color:var(--gold);padding:2px 8px;border-radius:10px;border:1px solid rgba(226,184,90,.6);white-space:nowrap}
.mypts{font:700 12px var(--sans);background:var(--paper);color:var(--ink);padding:3px 9px;border-radius:14px;white-space:nowrap}
.timer{font:800 44px/1 var(--serif);color:var(--gold)}
.readyrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.readyrow span{font-size:13px;padding:4px 10px;border-radius:20px;background:rgba(244,236,217,.12)}
.readyrow span.ok{background:var(--hunt);color:var(--ink);font-weight:700}

table.res{border-collapse:collapse;width:100%;max-width:400px;font-size:14px}
table.res th,table.res td{padding:7px 5px;text-align:right;border-bottom:1px solid rgba(244,236,217,.15)}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res th{font-weight:600;opacity:.7;font-size:12px}
table.res td.tot{font:800 16px var(--serif);color:var(--gold)}

.me{background:rgba(var(--prgb),.65);padding:8px 10px 4px;border-top:4px solid rgba(244,236,217,.15)}
.me.r-h{border-top-color:var(--hunt)} .me.r-c{border-top-color:var(--gold)}
.me.myturn{box-shadow:0 -6px 22px rgba(255,45,170,.55)}
.meinfo{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:4px;flex-wrap:wrap}
.meinfo .yt{margin-left:auto;font:800 14px var(--sans);color:#fff;background:var(--turn);box-shadow:0 0 14px rgba(255,45,170,.8);padding:3px 10px;border-radius:20px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.meinfo .yt{animation:none}.card{transition:none!important}}
.freshnote{font-size:12px;color:var(--fresh);font-weight:600}
.hand{display:flex;flex-wrap:wrap;padding:12px 0 2px 18px;row-gap:10px;--cw:50px;--ch:74px;min-height:92px}
.hand .card{margin-left:-18px;cursor:pointer}
.hint{font-size:14px;min-height:20px;margin:6px 0;text-align:center}
.hint.bad{color:#FFD2C4}
.hint.good{color:var(--gold);font-family:var(--serif);font-weight:700}
.hint.auto{color:#fff;font-weight:700}
.ctrl{display:flex;gap:8px}
.ctrl .btn{flex:1}

/* ---------- Cards ---------- */
.card{position:relative;width:var(--cw);height:var(--ch);flex:none;border-radius:7px;background:#fff;
  border:1px solid rgba(0,0,0,.22);box-shadow:0 1px 0 rgba(0,0,0,.2),-2px 2px 6px rgba(0,0,0,.25);transition:transform .12s,filter .15s,opacity .15s;color:var(--c)}
.card .v{position:absolute;left:4px;top:3px;font:800 calc(var(--cw)*.36)/1 var(--serif)}
.card .g{position:absolute;left:5px;top:calc(var(--cw)*.44);font-size:calc(var(--cw)*.24);line-height:1}
.card .nmc{position:absolute;right:3px;bottom:4px;writing-mode:vertical-rl;transform:rotate(180deg);font:800 calc(var(--cw)*.2)/1 var(--serif);letter-spacing:.04em;opacity:.85}
.card .tr{position:absolute;left:3px;bottom:4px;z-index:1;min-width:calc(var(--cw)*.42);padding:0 2px;height:calc(var(--cw)*.34);border-radius:calc(var(--cw)*.17);
  background:var(--gold);color:var(--ink);font:800 calc(var(--cw)*.22)/calc(var(--cw)*.34) var(--sans);text-align:center;font-style:normal;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.card .as{position:absolute;left:3px;bottom:4px;background:var(--paper);color:var(--ink);border-radius:5px;padding:0 3px;font:800 calc(var(--cw)*.24)/1.3 var(--serif)}
.s-j{--c:var(--jade)} .s-s{--c:var(--sword)} .s-p{--c:var(--pag)} .s-t{--c:var(--star)}
.card.hero{background:linear-gradient(165deg,#F4F8FD 0%,#C9D8EC 55%,#93AACB 100%);border:2px solid #3C5A86;box-shadow:inset 0 0 0 2px rgba(201,162,39,.55),-2px 2px 6px rgba(0,0,0,.25)}
.card .helm{position:absolute;left:3px;bottom:5px;width:calc(var(--cw)*.5);height:calc(var(--cw)*.5)}
.card.piya{--c:#3B1F0C;background:linear-gradient(150deg,#E7B07A 0%,#B87333 45%,#8A5225 100%);border-color:#6E3F18}
.card.chim{--c:#4A1208;background:linear-gradient(150deg,#FFF1B0 0%,#E9C04A 40%,#B8860B 100%);border-color:#8C6508}
.card.fresh{outline:3px solid var(--fresh);outline-offset:-2px}
.card.bomb{background:#FFE6D2;outline:3px solid var(--bomb);outline-offset:-2px}
.card.sel{transform:translateY(-13px);box-shadow:0 0 0 3px #fff,-2px 6px 12px rgba(0,0,0,.35)}
.card.dim{filter:grayscale(1) brightness(.7);opacity:.5;cursor:default}

.card.back{background-color:var(--back);border:2px solid var(--backl);
  background-image:repeating-linear-gradient(45deg,transparent 0 5px,color-mix(in srgb,var(--backl) 40%,transparent) 5px 6px),repeating-linear-gradient(-45deg,transparent 0 5px,color-mix(in srgb,var(--backl) 40%,transparent) 5px 6px)}
.cardrow.hide{--cw:62px;--ch:92px;gap:12px}
.cardrow.hide .card[data-hide]{cursor:pointer;box-shadow:0 0 0 3px var(--gold),0 4px 14px rgba(0,0,0,.4);animation:pulse 1.6s ease-in-out infinite}
.hand.zoom{--cw:66px;--ch:98px;padding-left:22px}.hand.zoom .card{margin-left:-22px}
.center.zoom .cardrow{--cw:64px;--ch:94px;padding-left:20px}.center.zoom .cardrow .card{margin-left:-20px}
.center.zoom .cardrow.loose .card{margin-left:0}.center.zoom .cardrow.loose{padding-left:0}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.yt+.tools{margin-left:6px}
.ib{border:1px solid rgba(244,236,217,.35);background:rgba(244,236,217,.1);color:var(--paper);border-radius:18px;min-height:34px;min-width:36px;padding:4px 9px;font:600 14px var(--sans);cursor:pointer;white-space:nowrap}
.ib small{font-size:11px;opacity:.7;margin-left:2px}
.ib.on{background:var(--gold);color:var(--ink)}
.ib.rec{background:#E5484D;border-color:#E5484D;color:#fff;animation:pulse 1.2s ease-in-out infinite}
.ib.vb.new{background:#fff;color:var(--ink);border-color:#fff;animation:pulse 1.6s ease-in-out infinite}
.ib.vb.play{background:var(--hunt);color:var(--ink);border-color:var(--hunt)}
.ib:disabled{opacity:.4}
.oppfoot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.oppfoot .ib{min-height:34px;padding:2px 12px;font-size:15px}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.vlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#EADFC6}
.vlist .btn{min-width:56px}
table.res.light td,table.res.light th{border-bottom-color:rgba(0,0,0,.12)}
table.res.light td.tot{color:var(--ink)}

/* Avatare, Reaktionen, Aussehen, Animationen */
.mid{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.avside{position:absolute;top:8px;z-index:3;pointer-events:none}.avside.l{left:8px}.avside.r{right:8px}
.avwrap{position:relative;flex:none}
.av{width:100%;height:100%;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 0 2px rgba(244,236,217,.6);overflow:hidden}
.av svg{width:100%;height:100%;display:block}
.av.e-laugh{animation:bob .45s ease-in-out 4}
.av.e-angry{animation:shake .35s ease-in-out 4}
.av.e-annoyed{animation:tilt 1s ease-in-out 2}
.av.e-sad{filter:saturate(.6) brightness(.9)}
.av.e-shock{animation:pop .3s ease-out 2}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes shake{25%{transform:translateX(-3px) rotate(-4deg)}75%{transform:translateX(3px) rotate(4deg)}}
@keyframes tilt{50%{transform:rotate(-8deg)}}
@keyframes pop{50%{transform:scale(1.15)}}
.reactb{position:absolute;top:-10px;right:-14px;font-size:24px;line-height:1;background:#fff;border-radius:50%;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.35);animation:pop .3s ease-out}
.meinfo .avwrap{margin-right:2px}
.reactbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.reactbar .ib{font-size:20px;min-width:42px}
.avgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.avpick{padding:0;border:3px solid transparent;border-radius:50%;background:none;aspect-ratio:1;cursor:pointer}
.avpick svg{width:100%;height:100%;display:block;border-radius:50%}
.avpick.on{border-color:var(--gold)}
.swatches{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.sw{aspect-ratio:1;border-radius:50%;border:2px solid rgba(244,236,217,.35);cursor:pointer;padding:0}
.sw.on{border:3px solid #fff;box-shadow:0 0 0 2px var(--gold)}
.sw.bk{border-radius:6px;aspect-ratio:.7;background-color:var(--back);background-image:repeating-linear-gradient(45deg,transparent 0 3px,var(--backl) 3px 4px)}
.sheet .sub{color:var(--ink)}
.trick.fly-me{animation:flyMe .5s cubic-bezier(.2,.8,.3,1)}
.trick.fly-left{animation:flyLeft .5s cubic-bezier(.2,.8,.3,1)}
.trick.fly-right{animation:flyRight .5s cubic-bezier(.2,.8,.3,1)}
@keyframes flyMe{from{transform:translateY(220px) scale(.7);opacity:.3}}
@keyframes flyLeft{from{transform:translate(-170px,-150px) scale(.6);opacity:.3}}
@keyframes flyRight{from{transform:translate(170px,-150px) scale(.6);opacity:.3}}
.trick.ghost{position:absolute;left:0;right:0;pointer-events:none;animation-duration:.6s;animation-fill-mode:forwards;animation-timing-function:ease-in}
.sweep-me{animation-name:swMe}.sweep-left{animation-name:swLeft}.sweep-right{animation-name:swRight}
@keyframes swMe{to{transform:translateY(260px) scale(.5);opacity:0}}
@keyframes swLeft{to{transform:translate(-190px,-170px) scale(.4);opacity:0}}
@keyframes swRight{to{transform:translate(190px,-170px) scale(.4);opacity:0}}
.cin{position:relative}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){.av,.trick,.reactb{animation:none!important}}
/* ---------- Overlay ---------- */
.ov{position:absolute;inset:0;background:rgba(30,10,6,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{overscroll-behavior:contain;background:var(--paper);color:var(--ink);width:100%;max-width:520px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet h2{font:800 22px var(--serif);margin:0}
.sheet .btn{background:#E6DABF}
.sheet .btn.gold{background:var(--gold)}
.sheet .btn.ghost{color:var(--ink);border-color:rgba(0,0,0,.25)}
.rules{font-size:14px;line-height:1.5}
.rules h4{font:800 16px var(--serif);margin:12px 0 4px}
.rules ul{margin:0;padding-left:18px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* FIREBASE AYARLARI – veriler "chimera/rooms/..." altında, Schulwegplan'dan ayrı durur. */
const firebaseConfig = {
  apiKey: "AIzaSyBZUgoJIh2flCdR4lNU8q4VxeB4G-St2Y0",
  authDomain: "schulwegend.firebaseapp.com",
  databaseURL: "https://schulwegend-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "schulwegend",
  storageBucket: "schulwegend.firebasestorage.app",
  messagingSenderId: "662513011948",
  appId: "1:662513011948:web:d5f21ae65a4d7b2b2769c9"
};
</script>
<script>
// ===ENGINE-START===
/* ---------------- Oyun motoru (kurallar) ----------------
   Kart kimlikleri: aile harfi + değer. j=Jade, s=Schwert, p=Pagode, t=Stern
   Değer 1..12 sayı, 13 = Kahraman (Held). "P" = Pi Ya (14), "C" = Kimera (15). */
const SUITS=['j','s','p','t'];
function makeDeck(){const d=[];for(const s of SUITS)for(let v=1;v<=13;v++)d.push(s+v);d.push('P','C');return d;}
function cv(id){return id==='P'?14:id==='C'?15:parseInt(id.slice(1),10);}
function suitOf(id){return (id==='P'||id==='C')?'z':id[0];}
function sortHand(h){return h.slice().sort((a,b)=>cv(a)-cv(b)||SUITS.indexOf(suitOf(a))-SUITS.indexOf(suitOf(b)));}
function rnd(n){if(typeof crypto!=='undefined'&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}return Math.floor(Math.random()*n);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function countVals(vals){const m={};vals.forEach(v=>m[v]=(m[v]||0)+1);return m;}
function isRun(keys){for(let i=1;i<keys.length;i++)if(keys[i]!==keys[i-1]+1)return false;return true;}
function groupByV(hand){const g={};sortHand(hand).forEach(id=>{const v=cv(id);(g[v]=g[v]||[]).push(id);});return g;}

function straightRank(vals){
  const n=vals.length,p=vals.filter(v=>v===14).length;
  if(p>1)return 0;
  const nv=vals.filter(v=>v!==14);
  if(nv.some(v=>v>12))return 0;
  if(new Set(nv).size!==nv.length)return 0;
  const mn=Math.min(...nv),mx=Math.max(...nv),span=mx-mn+1;
  if(p===0)return span===n?mx:0;
  if(span===n)return mx;
  if(span===n-1){if(mx<12)return mx+1;if(mn>1)return mx;}
  return 0;
}

function analyze(ids){
  const n=ids.length;if(!n)return[];
  const vals=ids.map(cv),c=countVals(vals);
  const keys=Object.keys(c).map(Number).sort((a,b)=>a-b);
  const hasP=!!c[14],hasC=!!c[15];
  const out=[];
  const add=(type,len,rank)=>{if(!out.some(o=>o.type===type&&o.len===len&&o.rank===rank))out.push({type,len,rank});};
  if(n===1)add('single',1,vals[0]);
  if(n===2){if(hasP&&hasC)add('attack',1,99);else if(keys.length===1&&keys[0]<=13)add('pair',1,keys[0]);}
  if(n===3&&keys.length===1&&keys[0]<=13)add('triple',1,keys[0]);
  if(n===4){
    if(keys.length===1&&keys[0]<=13)add('trap',1,keys[0]);
    if(keys.length===2)for(const k of keys)if(c[k]===3&&k<=13)add('triple1',1,k);
  }
  if(n===5&&keys.length===2){
    const[a,b]=keys;const tv=c[a]===3?a:(c[b]===3?b:null);
    if(tv!==null){const pv=tv===a?b:a;if(c[pv]===2&&tv<=13&&pv<=13)add('triplePair',1,tv);}
  }
  if(n>=6&&n%2===0&&keys.every(k=>k<=12&&c[k]===2)&&isRun(keys))add('pairSeq',n/2,keys[keys.length-1]);
  if(n>=6&&n%3===0&&keys.every(k=>k<=12&&c[k]===3)&&isRun(keys))add('tripleSeq',n/3,keys[keys.length-1]);
  if(n>=5){const r=straightRank(vals);if(r)add('straight',n,r);}
  if(n===6){
    for(const q of keys)if(q<=13&&c[q]===4){
      const rest=vals.filter(v=>v!==q);
      if(rest.length===2&&rest[0]!==rest[1]&&!(rest.includes(14)&&rest.includes(15)))add('quad2',1,q);
    }
  }
  if(n===8){
    for(const q of keys)if(q<=13&&c[q]===4){
      const rk=keys.filter(k=>k!==q);
      if(rk.length===2&&rk.every(k=>c[k]===2&&k<=13))add('quad2Pairs',1,q);
    }
  }
  if(n>=8&&n%4===0){
    const k=n/4;
    for(let s=1;s+k-1<=12;s++){
      const rest={...c};let ok=true;
      for(let v=s;v<s+k;v++){if((rest[v]||0)<3){ok=false;break;}rest[v]-=3;}
      if(!ok)continue;
      const left=[];for(const key in rest)for(let i=0;i<rest[key];i++)left.push(Number(key));
      if(left.length!==k||new Set(left).size!==k)continue;
      if(left.some(v=>v>=s&&v<s+k))continue;
      if(left.includes(14)&&left.includes(15))continue;
      add('tripleSeq1',k,s+k-1);
    }
  }
  if(n>=10&&n%5===0){
    const k=n/5;
    for(let s=1;s+k-1<=12;s++){
      const rest={...c};let ok=true;
      for(let v=s;v<s+k;v++){if(rest[v]!==3){ok=false;break;}rest[v]=0;}
      if(!ok)continue;
      const pk=Object.keys(rest).map(Number).filter(x=>rest[x]>0);
      if(pk.length!==k||!pk.every(x=>rest[x]===2&&x<=13))continue;
      add('tripleSeqPair',k,s+k-1);
    }
  }
  return out;
}

function beats(cand,top){
  if(!top)return true;
  if(top.type==='attack')return false;
  if(cand.type==='attack')return true;
  if(cand.type==='trap')return top.type!=='trap'||cand.rank>top.rank;
  return cand.type===top.type&&cand.len===top.len&&cand.rank>top.rank;
}

/* Elde, ortadaki kombinasyonu geçebilecek her kombinasyona katılabilen kartlar.
   Boş küme = geçmek imkânsız. */
function playableCards(hand,top){
  const res=new Set();
  if(!top){hand.forEach(i=>res.add(i));return res;}
  if(top.type==='attack')return res;
  const g=groupByV(hand),cnt=v=>(g[v]||[]).length,addV=v=>(g[v]||[]).forEach(i=>res.add(i));
  const vals=Object.keys(g).map(Number);
  if(cnt(14)&&cnt(15)){addV(14);addV(15);}
  for(let v=1;v<=13;v++)if(cnt(v)===4&&(top.type!=='trap'||v>top.rank))addV(v);
  if(top.type==='trap')return res;
  const R=top.rank,k=top.len,T=top.type;
  if(T==='single')vals.filter(v=>v>R).forEach(addV);
  if(T==='pair')vals.filter(v=>v>R&&v<=13&&cnt(v)>=2).forEach(addV);
  if(T==='triple')vals.filter(v=>v>R&&v<=13&&cnt(v)>=3).forEach(addV);
  if(T==='triple1'||T==='triplePair'){
    for(const t of vals)if(t>R&&t<=13&&cnt(t)>=3){
      const ks=T==='triple1'?vals.filter(v=>v!==t):vals.filter(v=>v!==t&&v<=13&&cnt(v)>=2);
      if(ks.length){addV(t);ks.forEach(addV);}
    }
  }
  if(T==='quad2'||T==='quad2Pairs'){
    for(const q of vals)if(q>R&&q<=13&&cnt(q)===4){
      const ks=T==='quad2'?vals.filter(v=>v!==q):vals.filter(v=>v!==q&&v<=13&&cnt(v)>=2);
      let d=ks.length;if(T==='quad2'&&ks.includes(14)&&ks.includes(15))d--;
      if(d>=2){addV(q);ks.forEach(addV);}
    }
  }
  if(T==='pairSeq'||T==='tripleSeq'){
    const need=T==='pairSeq'?2:3;
    for(let r=R+1;r<=12;r++){const s=r-k+1;if(s<1)continue;let ok=true;
      for(let v=s;v<=r;v++)if(cnt(v)<need){ok=false;break;}
      if(ok)for(let v=s;v<=r;v++)addV(v);}
  }
  if(T==='straight'){
    const hp=cnt(14)>0;
    for(let r=Math.max(R+1,k);r<=12;r++){const s=r-k+1;let miss=0;
      for(let v=s;v<=r;v++)if(!cnt(v))miss++;
      if(miss===0||(miss===1&&hp)){for(let v=s;v<=r;v++)addV(v);if(hp)addV(14);}}
  }
  if(T==='tripleSeq1'||T==='tripleSeqPair'){
    for(let r=R+1;r<=12;r++){const s=r-k+1;if(s<1)continue;let ok=true;
      for(let v=s;v<=r;v++)if(cnt(v)<3){ok=false;break;}
      if(!ok)continue;
      const out=vals.filter(v=>v<s||v>r);
      const ks=T==='tripleSeq1'?out:out.filter(v=>v<=13&&cnt(v)>=2);
      let d=ks.length;if(T==='tripleSeq1'&&ks.includes(14)&&ks.includes(15))d--;
      if(d>=k){for(let v=s;v<=r;v++)addV(v);ks.forEach(addV);}
    }
  }
  return res;
}

function treasure(pile){return pile.reduce((s,id)=>{const v=cv(id);return s+(v===2?10:v===11?5:0);},0);}
function pushLog(st,e){st.seq=(st.seq||0)+1;e.i=st.seq;st.log=(st.log||[]).concat([e]).slice(-40);}

function dealInto(st,redealt){
  const deck=shuffle(makeDeck());
  const cut=20+rnd(15);
  st.faceUp=deck[cut];
  st.hideout=deck.slice(0,3);
  st.hands=[[],[],[]];
  for(let i=3;i<deck.length;i++){const seat=(st.dealer+1+(i-3))%3;st.hands[seat].push(deck[i]);if(i===cut)st.faceUpSeat=seat;}
  st.hands=st.hands.map(sortHand);
  st.bid={high:0,by:-1,turn:st.faceUpSeat,passes:0,redealt:!!redealt,acts:[null,null,null]};
  st.phase='bid';st.chim=-1;st.turn=st.faceUpSeat;
  st.piles=[[],[],[]];st.played=[false,false,false];st.traps=0;st.attack=false;
  st.trick={top:null,cards:[],passes:0,pz:[false,false,false]};
  st.exchange=null;st.result=null;st.fresh=[[],[],[]];st.freshKind=[null,null,null];
  st.ready=[false,false,false];st.pauseUntil=null;st.hideLeft=null;
}

function newGame(limit,dealer,seq){
  const st={phase:'bid',limit:limit||400,scores:[0,0,0],round:1,dealer:dealer||0,log:[],history:[],seq:seq||0,stats:[0,1,2].map(()=>({c:0,h:0,cw:0,hw:0})),bombsGame:0};
  dealInto(st,false);pushLog(st,{k:'deal'});return st;
}

function startPlay(st){st.phase='play';st.turn=st.chim;st.trick={top:null,cards:[],passes:0,pz:[false,false,false]};}

function finishBid(st){
  const c=st.bid.by;st.chim=c;
  st.hideLeft=st.hideout.slice();st.fresh[c]=[];st.freshKind[c]='hideout';
  st.stats=st.stats||[0,1,2].map(()=>({c:0,h:0,cw:0,hw:0}));
  st.stats.forEach((x,i)=>{if(i===c)x.c++;else x.h++;});
  pushLog(st,{k:'chimIs',s:c,v:st.bid.high});
  st.phase='hideout';st.turn=c;
  return st;
}
function afterHideout(st){
  const n={20:0,30:1,40:2}[st.bid.high];
  if(n===0)startPlay(st);
  else{st.phase='exchange';st.exchange={n,give:[null,null,null]};st.turn=-1;}
  return st;
}

function endRound(st,winner){
  const bid=st.bid.high,ch=st.chim,hunters=[0,1,2].filter(s=>s!==ch),chimOut=winner===ch;
  const r={winner,chimOut,bid,chim:ch,base:[0,0,0],bonus:[0,0,0],bon:[],tre:[0,0,0],delta:[0,0,0]};
  if(chimOut){
    r.base[ch]=2*bid;
    if(st.traps)r.bon.push({k:'traps',n:st.traps,p:25*st.traps});
    if(st.attack)r.bon.push({k:'attack',p:25});
    if(hunters.some(h=>!st.played[h]))r.bon.push({k:'silent',p:25});
    r.bonus[ch]=r.bon.reduce((s,b)=>s+b.p,0);
  }else{
    r.base[ch]=-bid;hunters.forEach(h=>r.base[h]=20);
  }
  for(let s=0;s<3;s++){r.tre[s]=treasure(st.piles[s]);r.delta[s]=r.base[s]+r.bonus[s]+r.tre[s];st.scores[s]+=r.delta[s];}
  st.stats=st.stats||[0,1,2].map(()=>({c:0,h:0,cw:0,hw:0}));
  if(chimOut)st.stats[ch].cw++;else hunters.forEach(h=>st.stats[h].hw++);
  st.result=r;st.history=(st.history||[]).concat([r.delta]);st.turn=-1;
  st.ready=[false,false,false];st.pauseUntil=null;
  const mx=Math.max(...st.scores);
  if(mx>=st.limit&&st.scores.filter(x=>x===mx).length===1){st.phase='over';st.winner=st.scores.indexOf(mx);}
  else st.phase='roundEnd';
  return st;
}

function doPass(st,seat,auto){
  st.trick.passes++;st.trick.pz[seat]=true;pushLog(st,{s:seat,k:auto?'autoPass':'pass'});
  if(st.trick.passes>=2){
    const w=st.trick.top.by;
    st.piles[w]=st.piles[w].concat(st.trick.cards);
    st.trick={top:null,cards:[],passes:0,pz:[false,false,false]};
    st.turn=w;pushLog(st,{s:w,k:'took'});
  }else st.turn=(seat+1)%3;
  return st;
}

function applyAction(st0,seat,a){
  const st=JSON.parse(JSON.stringify(st0));
  if(seat<0||seat>2)return null;
  switch(a.t){
    case 'bid':{
      if(st.phase!=='bid'||st.bid.turn!==seat)return null;
      const b=st.bid;
      if(a.v==='pass'){
        b.passes++;b.acts[seat]='pass';pushLog(st,{s:seat,k:'bidPass'});
        if(b.high>0&&b.passes>=2)return finishBid(st);
        if(b.high===0&&b.passes>=3){
          if(!b.redealt){pushLog(st,{k:'redeal'});dealInto(st,true);return st;}
          b.high=20;b.by=st.faceUpSeat;b.passes=0;b.acts=[null,null,null];b.acts[st.faceUpSeat]=20;
          pushLog(st,{s:st.faceUpSeat,k:'forced'});
          b.turn=(st.faceUpSeat+1)%3;st.turn=b.turn;return st;
        }
        b.turn=(seat+1)%3;st.turn=b.turn;return st;
      }
      const v=Number(a.v);
      if(![20,30,40].includes(v)||v<=b.high)return null;
      b.high=v;b.by=seat;b.passes=0;b.acts[seat]=v;pushLog(st,{s:seat,k:'bid',v});
      if(v===40)return finishBid(st);
      b.turn=(seat+1)%3;st.turn=b.turn;return st;
    }
    case 'takeHide':{
      if(st.phase!=='hideout'||seat!==st.chim||!st.hideLeft.includes(a.id))return null;
      st.hideLeft=st.hideLeft.filter(i=>i!==a.id);
      st.hands[seat]=sortHand(st.hands[seat].concat([a.id]));
      st.fresh[seat]=st.fresh[seat].concat([a.id]);
      pushLog(st,{s:seat,k:'takeHide'});
      if(!st.hideLeft.length)afterHideout(st);
      return st;
    }
    case 'give':{
      if(st.phase!=='exchange'||seat===st.chim||st.exchange.give[seat])return null;
      const ids=a.ids,hand=st.hands[seat];
      if(!Array.isArray(ids)||ids.length!==st.exchange.n||new Set(ids).size!==ids.length||!ids.every(i=>hand.includes(i)))return null;
      st.exchange.give[seat]=ids;
      const hs=[0,1,2].filter(s=>s!==st.chim);
      if(hs.every(s=>st.exchange.give[s])){
        const[x,y]=hs,gx=st.exchange.give[x],gy=st.exchange.give[y];
        st.hands[x]=sortHand(st.hands[x].filter(i=>!gx.includes(i)).concat(gy));
        st.hands[y]=sortHand(st.hands[y].filter(i=>!gy.includes(i)).concat(gx));
        st.fresh[x]=gy.slice();st.fresh[y]=gx.slice();st.freshKind[x]='swap';st.freshKind[y]='swap';
        pushLog(st,{k:'swapped'});startPlay(st);
      }
      return st;
    }
    case 'play':{
      if(st.phase!=='play'||st.turn!==seat)return null;
      const ids=a.ids,hand=st.hands[seat];
      if(!Array.isArray(ids)||!ids.length||new Set(ids).size!==ids.length||!ids.every(i=>hand.includes(i)))return null;
      const opts=analyze(ids).filter(o=>beats(o,st.trick.top));
      if(!opts.length)return null;
      let o=opts[0];
      if(a.pick){const m=opts.find(x=>x.type===a.pick.type&&x.len===a.pick.len&&x.rank===a.pick.rank);if(m)o=m;}
      st.hands[seat]=hand.filter(i=>!ids.includes(i));
      st.trick.cards=st.trick.cards.concat(ids);
      st.trick.top={by:seat,type:o.type,len:o.len,rank:o.rank,cards:sortHand(ids)};
      st.trick.passes=0;st.trick.pz=[false,false,false];
      st.played[seat]=true;
      if(o.type==='trap')st.traps++;
      if(o.type==='trap'||o.type==='attack')st.bombsGame=(st.bombsGame||0)+1;
      if(o.type==='attack')st.attack=true;
      pushLog(st,{s:seat,k:'play',c:{type:o.type,len:o.len,rank:o.rank}});
      if(!st.hands[seat].length){st.piles[seat]=st.piles[seat].concat(st.trick.cards);pushLog(st,{s:seat,k:'out'});return endRound(st,seat);}
      st.turn=(seat+1)%3;return st;
    }
    case 'pass':{
      if(st.phase!=='play'||st.turn!==seat||!st.trick.top)return null;
      return doPass(st,seat,false);
    }
    case 'autopass':{ // herkes gönderebilir; sadece gerçekten geçilemiyorsa uygulanır
      const s=a.s;
      if(st.phase!=='play'||st.turn!==s||!st.trick.top||st.seq!==a.k)return null;
      if(playableCards(st.hands[s],st.trick.top).size)return null;
      return doPass(st,s,true);
    }
    case 'ready':{
      if(st.phase!=='roundEnd'&&st.phase!=='over')return null;
      st.ready=st.ready||[false,false,false];
      if(st.ready[seat])return null;
      st.ready[seat]=true;
      if(st.ready.every(Boolean)){
        if(st.phase==='over')return newGame(st.limit,(st.dealer+1)%3,st.seq);
        st.round++;st.dealer=(st.dealer+1)%3;st.log=[];dealInto(st,false);pushLog(st,{k:'deal'});
      }
      return st;
    }
    case 'pause':{
      if(st.phase!=='roundEnd'&&st.phase!=='over')return null;
      st.pauseUntil=Number(a.until);st.pauseBy=seat;return st;
    }
    case 'unpause':{
      if(!st.pauseUntil)return null;
      st.pauseUntil=null;return st;
    }
  }
  return null;
}

/* ---------------- Bilgisayar oyuncu ---------------- */
function genPlays(hand,top){
  const C=[];
  if(top&&top.type==='attack')return C;
  const g=groupByV(hand),cnt=v=>(g[v]||[]).length,take=(v,n)=>g[v].slice(0,n);
  const vals=Object.keys(g).map(Number).sort((a,b)=>a-b);
  const push=(ids,type)=>{const os=analyze(ids).filter(o=>beats(o,top));if(!os.length)return;C.push({ids,o:os.find(x=>x.type===type)||os[0]});};
  const want=t=>!top||top.type===t;
  const K=top?top.len:0;
  const lens=(a,b)=>{if(top)return[K];const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};
  const kick=(excl,n,pairs)=>{
    const pool=vals.filter(v=>!excl.includes(v)&&(!pairs||(cnt(v)>=2&&v<=13)));
    pool.sort((a,b)=>((a>=13?2:0)+(cnt(a)===1?0:1))-((b>=13?2:0)+(cnt(b)===1?0:1))||a-b);
    const out=[],used=[];
    for(const v of pool){if(used.length>=n)break;if(!pairs&&((v===14&&used.includes(15))||(v===15&&used.includes(14))))continue;used.push(v);out.push(...take(v,pairs?2:1));}
    return used.length>=n?out:null;
  };
  if(want('single'))for(const v of vals)push(take(v,1),'single');
  if(want('pair'))for(const v of vals)if(v<=13&&cnt(v)>=2)push(take(v,2),'pair');
  if(want('triple'))for(const v of vals)if(v<=13&&cnt(v)>=3)push(take(v,3),'triple');
  for(const v of vals)if(v<=13&&cnt(v)===4)push(take(v,4),'trap');
  if(cnt(14)&&cnt(15))push(['P','C'],'attack');
  for(const t of vals)if(t<=13&&cnt(t)>=3){
    if(want('triple1')){const k=kick([t],1);if(k)push(take(t,3).concat(k),'triple1');}
    if(want('triplePair')){const k=kick([t],1,true);if(k)push(take(t,3).concat(k),'triplePair');}
  }
  for(const q of vals)if(q<=13&&cnt(q)===4){
    if(want('quad2')){const k=kick([q],2);if(k)push(take(q,4).concat(k),'quad2');}
    if(want('quad2Pairs')){const k=kick([q],2,true);if(k)push(take(q,4).concat(k),'quad2Pairs');}
  }
  const runOK=(s,len,need)=>{for(let v=s;v<s+len;v++)if(cnt(v)<need)return false;return s>=1&&s+len-1<=12;};
  const runIds=(s,len,need)=>{const r=[];for(let v=s;v<s+len;v++)r.push(...take(v,need));return r;};
  const runVals=(s,len)=>{const r=[];for(let v=s;v<s+len;v++)r.push(v);return r;};
  if(want('pairSeq'))for(const len of lens(3,6))for(let s=1;s+len-1<=12;s++)if(runOK(s,len,2))push(runIds(s,len,2),'pairSeq');
  if(want('tripleSeq'))for(const len of lens(2,4))for(let s=1;s+len-1<=12;s++)if(runOK(s,len,3))push(runIds(s,len,3),'tripleSeq');
  if(want('tripleSeq1'))for(const len of lens(2,3))for(let s=1;s+len-1<=12;s++)if(runOK(s,len,3)){const k=kick(runVals(s,len),len);if(k)push(runIds(s,len,3).concat(k),'tripleSeq1');}
  if(want('tripleSeqPair'))for(const len of lens(2,3))for(let s=1;s+len-1<=12;s++)if(runOK(s,len,3)){const k=kick(runVals(s,len),len,true);if(k)push(runIds(s,len,3).concat(k),'tripleSeqPair');}
  if(want('straight')){
    const hp=cnt(14)>0;
    for(const len of lens(5,12))for(let r=len;r<=12;r++){
      const s=r-len+1,ids=[];let miss=0;
      for(let v=s;v<=r;v++){if(cnt(v))ids.push(g[v][0]);else miss++;}
      if(miss===0)push(ids,'straight');else if(miss===1&&hp)push(ids.concat(['P']),'straight');
    }
  }
  return C;
}

function handStrength(hand){
  const g=groupByV(hand);let s=0;
  for(const k in g){const v=+k,n=g[k].length;
    if(v===15)s+=3;else if(v===14)s+=2.2;else if(v===13)s+=1.2*n;else if(v===12)s+=.5*n;
    if(n===4)s+=3;else if(n===3)s+=.8;
    if(v<=7&&n===1)s-=.35;}
  return s;
}

function botAct(st,seat,level){
  const hand=st.hands[seat];
  if(st.phase==='roundEnd'||st.phase==='over')return{t:'ready'};
  if(st.phase==='hideout')return{t:'takeHide',id:st.hideLeft[0]};
  if(st.phase==='bid'){
    const next=st.bid.high<20?20:st.bid.high+10;
    if(next>40)return{t:'bid',v:'pass'};
    let want=0;
    if(level==='easy')want=Math.random()<.3?20+10*rnd(2):0;
    else{const s=handStrength(hand)+(level==='hard'?0:(Math.random()-.5)*2);
      want=s>=8?40:s>=6.3?30:s>=4.8?20:0;}
    return next<=want?{t:'bid',v:next}:{t:'bid',v:'pass'};
  }
  if(st.phase==='exchange'){
    const n=st.exchange.n;
    if(level==='easy')return{t:'give',ids:shuffle(hand.slice()).slice(0,n)};
    const g=groupByV(hand);
    const singles=hand.filter(id=>cv(id)<=10&&g[cv(id)].length===1);
    const pool=singles.length>=n?singles:sortHand(hand);
    return{t:'give',ids:pool.slice(0,n)};
  }
  if(st.phase==='play'){
    const top=st.trick.top;
    const plays=genPlays(hand,top);
    if(top&&!plays.length)return{t:'autopass',s:seat,k:st.seq};
    const fin=plays.find(p=>p.ids.length===hand.length);if(fin)return{t:'play',ids:fin.ids,pick:fin.o};
    const P=p=>({t:'play',ids:p.ids,pick:p.o});
    if(level==='easy'){
      if(top&&Math.random()<.3)return{t:'pass'};
      const safe=plays.filter(p=>p.o.type!=='trap'&&p.o.type!=='attack');
      const pool=safe.length?safe:plays;
      return P(pool[rnd(pool.length)]);
    }
    const isHunter=seat!==st.chim;
    const opps=isHunter?[st.chim]:[0,1,2].filter(s=>s!==seat);
    const oppMin=Math.min(...opps.map(s=>st.hands[s].length));
    const bomb=p=>p.o.type==='trap'||p.o.type==='attack';
    const special=p=>p.ids.filter(id=>cv(id)>=13).length;
    if(!top){
      const score=p=>p.ids.length*3-p.o.rank*.6-special(p)*5-(bomb(p)?60:0)
        +(level==='hard'&&oppMin<=3&&p.ids.length>oppMin?8:0)
        -(level==='hard'&&oppMin<=2&&p.ids.length===1?p.o.rank<10?10:0:0);
      plays.sort((a,b)=>score(b)-score(a));
      return P(plays[0]);
    }
    if(isHunter&&top.by!==st.chim&&top.by!==seat)return{t:'pass'}; // partner takes it
    const pts=treasure(st.trick.cards);
    const danger=oppMin<=(level==='hard'?5:3)||pts>=(level==='hard'?10:15);
    const cost=p=>p.o.rank+special(p)*6+(bomb(p)?80:0);
    plays.sort((a,b)=>cost(a)-cost(b));
    let cands=plays.filter(p=>!bomb(p));
    if(!cands.length)return danger?P(plays[0]):{t:'pass'};
    const best=cands[0];
    if(!danger&&special(best)&&pts<5&&Math.random()<(level==='hard'?.7:.5))return{t:'pass'};
    return P(best);
  }
  return null;
}

let AC=null,muted=localStorage.getItem('chim_mute')==='1';
function ac(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>ac(),{passive:true}));
function tone(f,dur,type,vol,when,slide){
  const a=ac();if(!a)return;const t0=a.currentTime+(when||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.15,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+.05);
}
function noise(dur,vol,when,freq){
  const a=ac();if(!a)return;const t0=a.currentTime+(when||0);
  const b=a.createBuffer(1,Math.max(1,Math.floor(a.sampleRate*dur)),a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=b;f.type='bandpass';f.frequency.value=freq||2000;f.Q.value=.8;
  g.gain.setValueAtTime(vol||.2,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f).connect(g).connect(a.destination);s.start(t0);s.stop(t0+dur+.02);
}

  card:()=>{noise(.08,.5,0,2600);tone(300,.07,'triangle',.08);},
  pass:()=>{tone(330,.16,'sine',.12,0,220);},
  bid:()=>{tone(523,.1,'triangle',.12);tone(784,.16,'triangle',.1,.08);},

  take:()=>{noise(.22,.35,0,900);tone(392,.12,'triangle',.08,.06);},
  boom:()=>{tone(110,1,'sine',.4,0,50);tone(220,.6,'triangle',.14,0,100);noise(.5,.4,0,250);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.13,i*.11));},
  shuffle:()=>{for(let i=0;i<7;i++)noise(.05,.22,i*.055,3200);},
  bell:()=>{tone(1320,.9,'sine',.16);tone(1980,.7,'sine',.06,.02);tone(1320,.9,'sine',.12,.5);}
};
function sfx(n){if(muted)return;try{SFX[n]&&SFX[n]();}catch(e){}}
const SND_PRI={takeHide:4,out:9,boom:8,took:6,play:5,swapped:4,chimIs:4,bid:3,forced:3,deal:2,redeal:2,pass:1,autoPass:1,bidPass:1};
function soundFor(e){
  if(e.k==='out')return'win';
  if(e.k==='play')return(e.c&&(e.c.type==='trap'||e.c.type==='attack'))?'boom':'card';
  if(e.k==='took')return'take';
  if(e.k==='swapped'||e.k==='takeHide')return'card';
  if(e.k==='bid'||e.k==='forced'||e.k==='chimIs')return'bid';
  if(e.k==='deal'||e.k==='redeal')return'shuffle';
  if(e.k==='pass'||e.k==='autoPass'||e.k==='bidPass')return'pass';
  return null;
}

async function createRoom(){
  if(!db){homeErr=t('setupTitle');render();return;}
  if(!getName()){homeErr=t('needName');render();return;}
  busy=true;render();
  try{
    await ensureAuth();
    for(let i=0;i<8;i++){
      const code=genCode();
      const res=await db.ref('chimera/rooms/'+code+'/meta').transaction(cur=>{if(cur)return;return{host:CID,limit:400,created:Date.now()};});
      if(res.committed){busy=false;await enterRoom(code);return;}
    }
  }catch(e){console.error(e);homeErr=t('netErr');}
  busy=false;render();
}

async function enterRoom(code,silent){
  if(!db)return;
  code=(code||'').toUpperCase().trim();if(!code)return;
  if(!getName()&&!silent){homeErr=t('needName');render();return;}
  busy=true;render();
  try{
    await ensureAuth();
    const ref=db.ref('chimera/rooms/'+code);
    const m=await ref.child('meta').once('value');
    if(!m.exists()){busy=false;if(!silent)homeErr=t('noRoom');localStorage.removeItem('chim_room');render();return;}
    const name=getName()||t('player');
    const res=await ref.child('players').transaction(p=>{
      p=p||{};
      for(let i=0;i<3;i++){const k='s'+i;if(p[k]&&p[k].cid===CID){p[k].name=name;p[k].av=MYAV;return p;}}
      for(let i=0;i<3;i++){const k='s'+i;if(!p[k]||!p[k].cid){p[k]={name,cid:CID,on:true,av:MYAV};return p;}}
      return;
    });
    const val=(res.snapshot&&res.snapshot.val())||{};
    let seat=-1;for(let i=0;i<3;i++)if(val['s'+i]&&val['s'+i].cid===CID)seat=i;
    busy=false;
    if(seat<0){overlay={kind:'claim',code,players:val};render();return;}
    subscribe(code,seat);
  }catch(e){console.error(e);busy=false;homeErr=t('netErr');render();}
}

function unsubscribe(){listeners.forEach(f=>f());listeners=[];}
function subscribe(code,seat){
  unsubscribe();LOCAL=false;
  roomCode=code;mySeat=seat;roomRef=db.ref('chimera/rooms/'+code);
  localStorage.setItem('chim_room',code);
  history.replaceState(null,'','?r='+code);
  view='room';
  const on=(path,fn)=>{const r=roomRef.child(path);r.on('value',fn);listeners.push(()=>r.off('value',fn));};
  on('meta',s=>{meta=s.val();render();});
  on('players',s=>{
    players=s.val()||{};
    const me=players['s'+mySeat];
    if(me&&me.cid&&me.cid!==CID){const msg=t('seatTaken');localLeave();toast(msg);return;}
    render();
  });
  const reactSeen={};
  on('react',s=>{const v=s.val()||{};
    for(let i=0;i<3;i++){const r=v['s'+i];if(!r||!r.ts||reactSeen[i]===r.ts)continue;reactSeen[i]=r.ts;
      if(i!==mySeat&&nowSrv()-r.ts<8000)showReact(i,r.e);}
    render();});
  voices=[];voiceLoaded=false;
  on('voice',s=>{
    const v=s.val()||{};
    const arr=Object.keys(v).map(id=>({id,...v[id]})).filter(x=>x.ts).sort((a,b)=>a.ts-b.ts);
    const known=new Set(voices.map(x=>x.id));
    for(const m of arr){
      if(!voiceCache[m.id])roomRef.child('voiceData/'+m.id).once('value').then(d=>{if(d.val())voiceCache[m.id]=d.val();});
      if(voiceLoaded&&!known.has(m.id)&&m.seat!==mySeat){toast(t('voiceNew',{n:m.name||seatName(m.seat)}));sfx('bid');}
    }
    voices=arr;voiceLoaded=true;render();
  });
  on('state',s=>{const v=s.val();const prev=ST;try{ST=v?JSON.parse(v):null;}catch(e){ST=null;}onState(prev,ST);render();});
  const conn=db.ref('.info/connected');
  const cfn=s=>{if(s.val()&&roomRef){const o=roomRef.child('players/s'+mySeat+'/on');o.onDisconnect().set(false);o.set(true);}};
  conn.on('value',cfn);listeners.push(()=>conn.off('value',cfn));
  render();
}

function setLocal(ns){const prev=ST;ST=ns;onState(prev,ST);render();scheduleBots();}
function scheduleBots(){
  clearTimeout(botTimer);
  if(!LOCAL||!ST)return;
  let seat,delay=1000;
  if(ST.phase==='bid')seat=ST.bid.turn!==mySeat?ST.bid.turn:undefined;
  else if(ST.phase==='hideout'){if(ST.chim!==mySeat){seat=ST.chim;delay=650;}}
  else if(ST.phase==='exchange'){seat=[1,2].find(s=>s!==ST.chim&&!ST.exchange.give[s]);delay=800;}
  else if(ST.phase==='play'){if(ST.turn!==mySeat){seat=ST.turn;delay=ST.trick.top?1100:1400;
      if(ST.trick.top&&!playableCards(ST.hands[seat],ST.trick.top).size)delay=1600;}}
  else if(ST.phase==='roundEnd'||ST.phase==='over'){if(!ST.pauseUntil&&Date.now()>=lastShowUntil){seat=[1,2].find(s=>!ST.ready[s]);delay=900;}}
  if(seat===undefined)return;
  botTimer=setTimeout(()=>{
    const a=botAct(ST,seat,LEVEL);
    let ns=a&&applyAction(ST,seat,a);
    if(!ns&&ST.phase==='play')ns=applyAction(ST,seat,{t:'pass'});
    if(ns)setLocal(ns);
  },delay);
}

/* ---------------- Aktionen senden ---------------- */
function send(a){
  if(LOCAL){
    const ns=applyAction(ST,mySeat,a);
    if(!ns){if(a.t!=='autopass')toast(t('notAllowed'));return;}
    setLocal(ns);return;
  }
  if(!roomRef)return;
  roomRef.child('state').transaction(cur=>{
    if(cur==null)return cur;
    let st;try{st=JSON.parse(cur);}catch(e){return;}
    const ns=applyAction(st,mySeat,a);
    if(!ns)return;
    return JSON.stringify(ns);
  },(err,ok)=>{if(a.t==='autopass')return;if(err)toast(t('netErr'));else if(!ok)toast(t('notAllowed'));},false);
}

function checkAutoPass(){
  if(!ST||ST.phase!=='play'||!ST.trick.top){clearTimeout(apTimer);apKey=null;return;}
  const s=ST.turn,key=ST.seq+':'+s;
  if(apKey===key)return;
  clearTimeout(apTimer);apKey=null;
  if(playableCards(ST.hands[s],ST.trick.top).size)return;
  if(LOCAL&&s!==mySeat)return; // botlar kendi pas geçer
  const delay=s===mySeat?4000:6500; // başkası çevrimdışıysa yedek
  apKey=key;apUntil=Date.now()+delay;
  const k=ST.seq;
  apTimer=setTimeout(()=>{if(ST&&ST.seq===k)send({t:'autopass',s,k});},delay);
}

function onState(prev,cur){
  try{reactToEvents(prev,cur);}catch(e){console.warn(e);}
  if(!cur){sel.clear();clearTimeout(apTimer);apKey=null;return;}
  const hand=(cur.hands&&cur.hands[mySeat])||[];
  for(const id of [...sel])if(!hand.includes(id))sel.delete(id);
  if(prev&&(prev.phase!==cur.phase||prev.round!==cur.round))sel.clear();
  // Ses
  if(prev&&prev.phase==='play'&&(cur.phase==='roundEnd'||cur.phase==='over')){lastShowUntil=Date.now()+7000;setTimeout(()=>{render();scheduleBots();},7050);}
  if(prev&&(cur.seq||0)>(prev.seq||0)){
    const news=(cur.log||[]).filter(e=>e.i>(prev.seq||0));
    let best=null,bp=-1;
    for(const e of news){let p=SND_PRI[e.k]||0;if(e.k==='play'&&e.c&&(e.c.type==='trap'||e.c.type==='attack'))p=SND_PRI.boom;if(p>bp){bp=p;best=e;}}
    const n=best&&soundFor(best);if(n)sfx(n);
  }
  const myTurnNow=cur.turn===mySeat&&(cur.phase==='play'||cur.phase==='bid'||cur.phase==='hideout');
  const myTurnBefore=prev&&prev.turn===mySeat&&prev.phase===cur.phase;
  if(myTurnNow&&!myTurnBefore){setTimeout(()=>sfx('turn'),350);if(navigator.vibrate)navigator.vibrate(40);}
  document.title=myTurnNow?'● Chimera':'Chimera';
  checkAutoPass();
}

  const r=document.documentElement,tb=TABLES[MYTAB]||TABLES[0],bk=BACKS[MYBACK]||BACKS[0];
  if(!r.style||!r.style.setProperty)return;
  r.style.setProperty('--table',tb.table);r.style.setProperty('--deep',tb.deep);r.style.setProperty('--deeper',tb.deeper);r.style.setProperty('--prgb',tb.prgb);
  r.style.setProperty('--back',bk.b);r.style.setProperty('--backl',bk.l);

}

/* Eigene illustrierte Porträts (keine fremden Grafiken) */
function mir(d){let i=0;return d.replace(/[A-Za-z]|-?\d*\.?\d+/g,tok=>{if(/[A-Za-z]/.test(tok)){i=0;return tok;}const n=parseFloat(tok);const r=(i%2===0)?(120-n):n;i++;return String(+r.toFixed(2));});}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;r=Math.max(0,Math.min(255,Math.round(r*(1+amt))));g=Math.max(0,Math.min(255,Math.round(g*(1+amt))));b=Math.max(0,Math.min(255,Math.round(b*(1+amt))));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

/* Mimik & Reaktionen */
const EXPR={},REACT={};
function setExpr(seat,e,ms){EXPR[seat]={e,until:Date.now()+(ms||3200)};setTimeout(()=>render(),(ms||3200)+60);}
function exprOf(seat){const x=EXPR[seat];return x&&Date.now()<x.until?x.e:'neutral';}
function showReact(seat,e){REACT[seat]={e,until:Date.now()+3500};setTimeout(()=>render(),3560);}
function avOf(seat){const p=players['s'+seat];if(p&&p.av!=null)return Number(p.av);return seat===mySeat?MYAV:(seat*5+3)%AVS.length;}
function avatarHTML(seat,size){
  const ex=exprOf(seat),r=REACT[seat]&&Date.now()<REACT[seat].until?REACT[seat].e:'';
  return `<div class="avwrap" style="width:${size}px;height:${size}px"><div class="av e-${ex}">${avatarSVG(avOf(seat),ex)}</div>${r?`<span class="reactb">${r}</span>`:''}</div>`;
}
const REACTS=['👏','😂','😱','😡','😍','🙈','👍','🔥'];
function sendReact(e){
  showReact(mySeat,e);render();
  if(!LOCAL&&roomRef)roomRef.child('react/s'+mySeat).set({e,ts:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});
}

/* Konfetti */
function confetti(level){
  try{
    if(typeof requestAnimationFrame==='undefined'||!document.createElement)return;
    let c=document.getElementById('fx');
    if(!c){c=document.createElement('canvas');c.id='fx';document.body.appendChild(c);}
    const dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
    c.width=W*dpr;c.height=H*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);
    const cols=['#E2B85A','#FF2DAA','#5CC8B4','#B98AF5','#FFFFFF','#E5484D','#7CD992'];
    const n=level>=2?340:150,dur=level>=2?4800:2800,P=[];
    for(let i=0;i<n;i++){const fromSide=level>=2&&i%2;P.push({x:fromSide?(i%4<2?-10:W+10):W*Math.random(),y:fromSide?H*0.6:-20-Math.random()*H*0.3,
      vx:fromSide?(i%4<2?1:-1)*(3+Math.random()*6):(Math.random()-.5)*3,vy:fromSide?-(6+Math.random()*7):2+Math.random()*3,
      s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});}
    const t0=performance.now();
    (function step(t){
      const el=t-t0;g.clearRect(0,0,W,H);
      for(const p of P){p.vy+=0.12;p.vx*=0.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
        g.save();g.translate(p.x,p.y);g.rotate(p.r);g.globalAlpha=Math.max(0,1-el/dur);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore();}
      if(el<dur)requestAnimationFrame(step);else g.clearRect(0,0,W,H);
    })(t0);
  }catch(e){}
}

/* Animationen (Karte fliegt in die Mitte, Stich rutscht zum Gewinner) */
let playAnim=null,takeAnim=null;
function dirOf(seat){return seat===mySeat?'me':seat===(mySeat+1)%3?'left':'right';}

/* Ereignisse aus neuen Log-Einträgen in Mimik, Animation, Konfetti übersetzen */
function reactToEvents(prev,cur){
  if(!prev||!cur||(cur.seq||0)<=(prev.seq||0))return;
  const news=(cur.log||[]).filter(e=>e.i>(prev.seq||0));
  for(const e of news){
    if(e.k==='play'){
      playAnim={from:dirOf(e.s),until:Date.now()+520};setTimeout(()=>render(),540);
      const pt=prev.trick&&prev.trick.top;
      if(pt&&pt.by!==e.s){
        const partners=cur.chim>=0&&pt.by!==cur.chim&&e.s!==cur.chim;
        setExpr(pt.by,partners?'angry':'annoyed');
      }
      if(e.c&&(e.c.type==='trap'||e.c.type==='attack')){
        [0,1,2].filter(s=>s!==e.s&&!(pt&&s===pt.by)).forEach(s=>setExpr(s,'shock',2600));
        setExpr(e.s,'laugh');
      }
    }
    if(e.k==='took'){
      const top=prev.trick&&prev.trick.top;
      if(top)takeAnim={cards:top.cards,type:top,to:dirOf(e.s),until:Date.now()+650};
      setTimeout(()=>render(),680);
      setExpr(e.s,'laugh',2600);
      if(LOCAL&&e.s!==mySeat&&Math.random()<.25)showReact(e.s,['😂','👍','🔥','😎'][rnd(4)]);
    }
  }
  if(prev.phase==='play'&&(cur.phase==='roundEnd'||cur.phase==='over')&&cur.result){
    const r=cur.result,win=r.chimOut?[r.chim]:[0,1,2].filter(s=>s!==r.chim);
    [0,1,2].forEach(s=>setExpr(s,win.includes(s)?'laugh':'sad',8000));
    if(cur.phase==='over')confetti(cur.winner===mySeat?3:2);
    else if(win.includes(mySeat))confetti(1);
    if(LOCAL)win.filter(s=>s!==mySeat).forEach(s=>{if(Math.random()<.5)showReact(s,'😂');});
  }
}

/* Her mesaj her dinleyici için en fazla 2 kez çalar; iki dinleyici de 2 kez dinleyince silinir. */
function myPlays(m){return(m.plays&&m.plays['s'+mySeat])||0;}
function pendingFrom(seat){return voices.filter(m=>m.seat===seat&&seat!==mySeat&&myPlays(m)<2);}
function countPlay(m){
  const r=roomRef;if(!r)return;
  r.child('voice/'+m.id+'/plays/s'+mySeat).transaction(n=>(n||0)+1).then(()=>r.child('voice/'+m.id).once('value')).then(snap=>{
    const v=snap.val();if(!v)return;
    const others=[0,1,2].filter(x=>x!==v.seat);
    if(others.every(x=>((v.plays||{})['s'+x]||0)>=2)){r.child('voice/'+m.id).remove();r.child('voiceData/'+m.id).remove();}
  }).catch(()=>{});

function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
async function startRec(){
  if(rec||LOCAL||!roomRef)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast(t('noMic'));return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast(t('micDenied'));return;}
  const mime=['audio/mp4','audio/aac','audio/webm;codecs=opus','audio/webm'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
  let mr;
  try{mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{});}catch(e){mr=new MediaRecorder(stream);}
  const chunks=[],start=Date.now();
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  mr.onstop=()=>{
    stream.getTracks().forEach(tr=>tr.stop());
    const cancel=rec&&rec.cancel;clearTimeout(rec&&rec.timer);rec=null;render();
    const dur=(Date.now()-start)/1000;
    if(cancel||dur<0.6||!chunks.length)return;
    uploadVoice(new Blob(chunks,{type:mr.mimeType||mime||'audio/mp4'}),dur);
  };
  mr.start(250);
  rec={mr,until:Date.now()+30000,cancel:false};
  rec.timer=setTimeout(()=>stopRec(false),30000);
  render();
}
function stopRec(cancel){if(!rec)return;rec.cancel=!!cancel;clearTimeout(rec.timer);try{rec.mr.stop();}catch(e){rec=null;render();}}
async function uploadVoice(blob,dur){
  try{
    const data=await blobToDataURL(blob);
    if(data.length>1500000){toast(t('playErr'));return;}
    const ref=roomRef.child('voice').push();
    voiceCache[ref.key]=data;
    await roomRef.child('voiceData/'+ref.key).set(data);
    await ref.set({seat:mySeat,name:seatName(mySeat),ts:firebase.database.ServerValue.TIMESTAMP,dur:Math.max(1,Math.round(dur))});
    toast(t('voiceSent'));
  }catch(e){console.error(e);toast(t('netErr'));}
}
function playVoice(m){
  if(playing){try{playing.a.pause();}catch(e){}playing=null;}
  const id=m.id,data=voiceCache[id];
  if(!data){roomRef.child('voiceData/'+id).once('value').then(d=>{if(d.val())voiceCache[id]=d.val();});toast(t('playErr'));render();return;}
  const a=new Audio(data);playing={id,a,seat:m.seat};
  a.onended=()=>{if(playing&&playing.id===id){playing=null;render();}};
  render();
  a.play().then(()=>countPlay(m)).catch(()=>{playing=null;toast(t('playErr'));render();});
}

  <div class="mid"><div class="avside l">${avatarHTML(a,56)}</div><div class="avside r">${avatarHTML(b,56)}</div>
  <main class="center ${ZOOM?'zoom':''}"><div class="cin">${centerHTML()}</div></main></div>
  <section class="me ${roleCls(mySeat)} ${myTurn?'myturn':''}">
    <div class="meinfo">${avatarHTML(mySeat,40)}<span class="nm">${esc(seatName(mySeat))}</span>${roleBadge(mySeat)}<span class="stbox mine">${statLine(mySeat)}</span>${sleeper(mySeat)}${myTurn?`<span class="yt">${t('yourTurn')}</span>`:''}
      <span class="tools">${LOCAL?'':(rec?`<button class="ib rec" data-act="recStop">■ ${t('voiceSend')} ${untilSpan(rec.until,'s')}</button><button class="ib" data-act="recCancel" aria-label="x">✕</button>`:`<button class="ib" data-act="recStart" aria-label="${t('voiceRec')}">🎙</button>`)}<button class="ib ${reactOpen?'on':''}" data-act="reactToggle" aria-label="${t('react')}">😊</button><button class="ib ${ZOOM?'on':''}" data-act="zoom" aria-label="${t('zoom')}">🔍</button></span></div>
    ${reactOpen?`<div class="reactbar">${REACTS.map(e=>`<button class="ib" data-act="react" data-e="${e}">${e}</button>`).join('')}</div>`:''}
    ${freshNote}
    <div class="hand">${handHTML}${ST.phase==='play'?`<div class="ptsbox">${t('myPts',{p:treasure(ST.piles[mySeat])})}</div>`:''}</div>
    ${controlsHTML()}
  </section>`;
}

function overlayHTML(){
  if(!overlay)return'';
  if(overlay.kind==='menu')return `<div class="ov" data-act="closeOv"><div class="sheet" data-stop="1">
    <h2>${LOCAL?t('practiceShort'):t('room')+' '+esc(roomCode)}</h2>
    ${LOCAL?'':`<button class="btn" data-act="share">${t('shareLink')}</button>`}
    <button class="btn" data-act="rules">${t('rules')}</button>
    <button class="btn" data-act="stats">${t('statsTitle')}</button>
    <button class="btn" data-act="look">${t('look')}</button>
    <button class="btn" data-act="sound">${muted?t('soundOff'):t('soundOn')}</button>
    <button class="btn" data-act="lang">${t('lang')}</button>
    <button class="btn ghost" data-act="home">← ${LOCAL?t('leavePractice'):t('home')}</button>
    <button class="btn gold" data-act="closeOv">${t('close')}</button>
    <p class="note" style="text-align:center;opacity:.5">v9 · ${innerWidth}×${innerHeight} · ${screen.width}×${screen.height} · ${navigator.standalone?'app':'web'}${TALL?' · short':''}</p></div></div>`;
  if(overlay.kind==='stats'){
    const stt=ST&&ST.stats||[0,1,2].map(()=>({c:0,h:0,cw:0,hw:0}));
    return `<div class="ov" data-act="closeOv"><div class="sheet" data-stop="1"><h2>${t('statsTitle')}</h2>
      <table class="res light"><tr><th></th><th>🐉 ${t('colChim')}</th><th>🏹 ${t('colHunt')}</th><th>${t('colTotal')}</th></tr>
      ${[0,1,2].map(s=>`<tr><td>${esc(seatName(s))}</td><td>${stt[s].c}× <span class="sub">(${stt[s].cw} ${t('colWon')})</span></td><td>${stt[s].h}× <span class="sub">(${stt[s].hw} ${t('colWon')})</span></td><td class="tot">${ST?ST.scores[s]:0}</td></tr>`).join('')}</table>
      <p class="note">${t('roundOf',{r:ST?ST.round:1})} · ${t('limitWin')}: ${ST?ST.limit:''} · 💣 ${t('bombsGame')}: ${ST&&ST.bombsGame||0}</p>
      <button class="btn gold" data-act="closeOv">${t('close')}</button></div></div>`;
  }
  if(overlay.kind==='look')return `<div class="ov" data-act="closeOv"><div class="sheet" data-stop="1"><h2>${t('look')}</h2>${lookHTML()}
    <button class="btn gold" data-act="closeOv">${t('close')}</button></div></div>`;
  if(overlay.kind==='rules')return `<div class="ov" data-act="closeOv"><div class="sheet" data-stop="1">
    <h2>${t('rules')}</h2><div class="rules">${L[lang].rulesHTML}</div>
    <button class="btn gold" data-act="closeOv">${t('close')}</button></div></div>`;
  if(overlay.kind==='pick')return `<div class="ov" data-act="closeOv"><div class="sheet" data-stop="1">
    <h2>${t('pickInterp')}</h2>
    ${overlay.opts.map((o,i)=>`<button class="btn" data-act="pickGo" data-i="${i}">${esc(comboText(o))}</button>`).join('')}
    <button class="btn ghost" data-act="closeOv">${t('close')}</button></div></div>`;
  if(overlay.kind==='claim'){
    const p=overlay.players||{};
    return `<div class="ov"><div class="sheet"><h2>${t('full')}</h2>
      ${[0,1,2].filter(i=>p['s'+i]&&p['s'+i].cid).map(i=>`<button class="btn" data-act="claim" data-i="${i}">${t('claim',{n:esc(p['s'+i].name)})}${p['s'+i].on===false?' (offline)':''}</button>`).join('')}
      <button class="btn ghost" data-act="closeOv">${t('close')}</button></div></div>`;
  }
  return '';
}

function render(){
  document.documentElement.lang=lang;
  let html;
  if(view==='home')html=homeHTML();
  else if(!ST)html=lobbyHTML();
  else html=gameHTML();
  $('#app').innerHTML=html+overlayHTML();
}

/* Countdown-Anzeigen + Pausenglocke */
setInterval(()=>{
  document.querySelectorAll('[data-until]').forEach(el=>{el.textContent=fmtMs(Math.max(0,Number(el.dataset.until)-Date.now()),el.dataset.fmt);});
  if(ST&&ST.pauseUntil&&bellFor!==ST.pauseUntil&&nowSrv()>=ST.pauseUntil){
    bellFor=ST.pauseUntil;sfx('bell');toast(t('pauseOver'));render();scheduleBots();
  }
},250);

/* ---------------- Eingaben ---------------- */
function breaksBomb(ids,o){
  if(o.type==='trap'||o.type==='attack')return false;
  const b=bombCards(ST.hands[mySeat]||[]);return ids.some(i=>b.has(i));
}
function shareLink(){
  const url=location.origin+location.pathname+'?r='+roomCode;
  if(navigator.share)navigator.share({title:'Chimera',text:'Chimera '+roomCode,url}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast(t('copied')));
  else prompt('Link',url);
}

function toggleCard(id){
  if(!ST)return;
  if(ST.phase==='exchange'){
    if(mySeat===ST.chim||ST.exchange.give[mySeat])return;
    if(sel.has(id))sel.delete(id);else if(sel.size<ST.exchange.n)sel.add(id);
  }else if(ST.phase==='play'){
    const v0=cv(id),now=Date.now();
    if(lastTap.v===v0&&now-lastTap.t<400&&v0<=13){
      // Schnellauswahl: Doppeltipp wählt alle Karten dieses Wertes
      const hand0=ST.hands[mySeat]||[],pl=ST.trick.top&&ST.turn===mySeat?playableCards(hand0,ST.trick.top):null;
      hand0.filter(i=>cv(i)===v0&&(!pl||pl.has(i))).forEach(i=>sel.add(i));
      lastTap={v:null,t:0};render();return;
    }
    lastTap={v:v0,t:now};
    const top=ST.trick.top,hand=ST.hands[mySeat]||[],other=id==='P'?'C':id==='C'?'P':null;
    if(sel.has(id)){sel.delete(id);if(other&&top&&sel.has(other)&&!analyze([other]).some(o=>beats(o,top)))sel.delete(other);}
    else{
      sel.add(id);
      // Tek Kimera / Pi Ya yetmiyorsa ikisini birlikte seç: Kimera saldırısı
      if(other&&top&&hand.includes(other)&&!analyze([id]).some(o=>beats(o,top))){sel.clear();sel.add('P');sel.add('C');}
    }
  }else return;
  render();
}

function act(a,d){
  switch(a){
    case 'create':createRoom();break;
    case 'join':{const c=($('#codeIn')||{}).value||'';homeErr='';enterRoom(c);break;}
    case 'practice':startPractice();break;
    case 'lang':lang=lang==='tr'?'de':'tr';localStorage.setItem('chim_lang',lang);if(overlay&&overlay.kind==='menu')overlay=null;render();break;
    case 'sound':muted=!muted;localStorage.setItem('chim_mute',muted?'1':'0');if(!muted)sfx('card');render();break;
    case 'share':shareLink();break;
    case 'start':startGame();break;
    case 'leave':overlay=null;leaveRoom();break;
    case 'home':if(confirm(LOCAL?t('confirmPractice'):t('confirmLeave'))){overlay=null;leaveRoom();}break;
    case 'menu':overlay={kind:'menu'};render();break;
    case 'rules':overlay={kind:'rules'};render();break;
    case 'closeOv':overlay=null;render();break;
    case 'bid':send({t:'bid',v:d.v==='pass'?'pass':Number(d.v)});break;
    case 'give':send({t:'give',ids:[...sel]});break;
    case 'clear':sel.clear();render();break;
    case 'pass':send({t:'pass'});break;
    case 'play':{
      const ids=[...sel],ok=analyze(ids).filter(o=>beats(o,ST.trick.top));
      if(!ok.length)return;
      if(ok.length>1&&!ST.trick.top){overlay={kind:'pick',ids,opts:ok};render();return;}
      if(breaksBomb(ids,ok[0])&&!confirm(t('breakBomb')))return;
      send({t:'play',ids,pick:ok[0]});break;
    }
    case 'pickGo':{const o=overlay.opts[Number(d.i)],ids=overlay.ids;overlay=null;render();if(breaksBomb(ids,o)&&!confirm(t('breakBomb')))return;send({t:'play',ids,pick:o});break;}
    case 'ready':send({t:'ready'});break;
    case 'pause':send({t:'pause',until:nowSrv()+5*60*1000});break;
    case 'unpause':send({t:'unpause'});break;
    case 'stats':overlay={kind:'stats'};render();break;
    case 'look':overlay={kind:'look'};render();break;
    case 'setAv':MYAV=Number(d.i);localStorage.setItem('chim_av',MYAV);if(players['s'+mySeat])players['s'+mySeat].av=MYAV;
      if(!LOCAL&&roomRef&&mySeat>=0)roomRef.child('players/s'+mySeat+'/av').set(MYAV);setExpr(mySeat,'laugh',1500);render();break;
    case 'setTab':MYTAB=Number(d.i);localStorage.setItem('chim_tab',MYTAB);applyLook();render();break;
    case 'setBack':MYBACK=Number(d.i);localStorage.setItem('chim_back',MYBACK);applyLook();render();break;
    case 'reactToggle':reactOpen=!reactOpen;render();break;
    case 'react':reactOpen=false;sendReact(d.e);break;
    case 'voiceSeat':playFrom(Number(d.s));break;
    case 'recStart':startRec();break;
    case 'recStop':stopRec(false);break;
    case 'recCancel':stopRec(true);break;
    case 'zoom':ZOOM=!ZOOM;localStorage.setItem('chim_zoom',ZOOM?'1':'0');render();break;
    case 'claim':claimSeat(overlay.code,Number(d.i));break;
  }
}

/* Dokunma: ekran o an yenilense bile basış kaybolmasın diye öğe parmak değdiği anda yakalanır */
function tapTarget(e){
  const el=e.target.closest('[data-card],[data-hide],[data-act]');
  if(!el||el.disabled)return null;
  if(el.classList.contains('ov')&&e.target.closest('[data-stop]'))return null;
  return el;
}
function fire(el){
  if(el.dataset.card!==undefined){toggleCard(el.dataset.card);return;}
  if(el.dataset.hide!==undefined){send({t:'takeHide',id:el.dataset.hide});return;}
  act(el.dataset.act,el.dataset);
}
let down=null,lastFire=0;
document.addEventListener('pointerdown',e=>{const el=tapTarget(e);down=el?{el,x:e.clientX,y:e.clientY}:null;},{passive:true});
document.addEventListener('pointercancel',()=>{down=null;});
document.addEventListener('pointerup',e=>{
  if(!down)return;const d=down;down=null;
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>14)return;
  lastFire=Date.now();fire(d.el);
});
document.addEventListener('click',e=>{
  if(Date.now()-lastFire<700)return; // pointerup zaten işledi
  const el=tapTarget(e);if(el)fire(el);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.card){e.preventDefault();toggleCard(e.target.dataset.card);}
  if(e.key==='Enter'&&e.target.id==='codeIn')act('join',{});
});
document.addEventListener('input',e=>{
  if(e.target.id==='nameIn'){localStorage.setItem('chim_name',e.target.value.trim().slice(0,16));homeErr='';}
});
document.addEventListener('change',e=>{
  if(e.target.id==='limSel'&&roomRef)roomRef.child('meta/limit').set(Number(e.target.value));
  if(e.target.id==='plimSel'){PLIM=Number(e.target.value);localStorage.setItem('chim_plim',PLIM);}
  if(e.target.id==='lvlSel'){LEVEL=e.target.value;localStorage.setItem('chim_lvl',LEVEL);}
});

/* iPhone ana ekran uygulaması: bazı iOS sürümlerinde alt kısım uygulamaya verilmiyor;
   o zaman alttaki boş güvenlik payını kaldırıyoruz (hiçbir şey kesilmez). */
let TALL=false;
function fitApp(){
  const app=document.getElementById('app');if(!app)return;
  const portrait=window.innerHeight>=window.innerWidth;
  const full=portrait?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
  TALL=!!navigator.standalone&&window.innerHeight<full-20;
  app.style.paddingBottom=TALL?'6px':'';
}
fitApp();window.addEventListener('orientationchange',()=>setTimeout(fitApp,300));window.addEventListener('resize',fitApp);
/* ---------------- Start ---------------- */
(function boot(){
  applyLook();
  initFirebase();
  const urlRoom=new URLSearchParams(location.search).get('r');
  const saved=localStorage.getItem('chim_room');
  render();
  if(!db)return;
  if(urlRoom&&getName())enterRoom(urlRoom,true);
  else if(!urlRoom&&saved&&getName())enterRoom(saved,true);
})();
</script>
